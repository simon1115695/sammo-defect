<title>Defect Review</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#e3e6ea;--accent:#2563eb;

@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1216;--card:#181c22;--ink:#e8eaed;
--muted:#9aa3ad;--line:#2a2f37;--accent:#5b8def;--pending:#f0a935;--pending-bg:#3a2c11;--done:#4ade80;
--done-bg:#123020;--shadow:0 1px 3px rgba(0,0,0,.4);}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:10}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:17px;margin:0 0 6px}
#defsel{font-size:16px;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);max-width:100%}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.stat{font-size:12px}.stat b{font-size:17px;display:block}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px;max-width:400px}
.bar>i{display:block;height:100%;background:var(--done)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.controls input,.controls select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;flex:1;min-width:120px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1 0 100%}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);padding:10px 6px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.count{color:var(--muted);font-size:12px;margin-bottom:10px}
.loc-h{position:sticky;top:0;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:16px 0 8px;padding:6px 0;background:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-pending{background:var(--pending-bg);color:var(--pending)}.b-done{background:var(--done-bg);color:var(--done)}
.meta{color:var(--muted);font-size:12px;margin-top:2px}
.desc{margin:8px 0}
.kv{font-size:13px;margin:3px 0}.kv b{color:var(--muted);font-weight:600}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.imgs figure{margin:0}.imgs figcaption{font-size:11px;color:var(--muted);margin-bottom:4px}
.imgs img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:var(--bg);aspect-ratio:4/3;object-fit:cover}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 8px;display:inline-block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;padding:12px}
#modal img{max-width:100%;max-height:100%;border-radius:8px}
.empty{text-align:center;color:var(--muted);padding:40px}
@media(max-width:520px){header{position:static}.controls input{flex:1 0 100%}.controls select{flex:1 0 calc(50% - 4px)}}
</style></head><body>

<script>
const APP=window.APP,$=s=>document.querySelector(s);let CUR=0,fStatus='all';
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
APP.defects.forEach((d,idx)=>{const o=document.createElement('option');o.value=idx;o.textContent=`${d.meta.defect_no} — ${d.meta.status}`;$('#defsel').appendChild(o);});
function loadDefect(){const D=APP.defects[CUR],M=D.meta,ITEMS=D.items;window._I=ITEMS;window._M=M;
document.title=`Defect ${M.defect_no}`;
const done=ITEMS.filter(i=>i.status==='Completed').length,pend=ITEMS.filter(i=>i.status==='Pending').length;
$('#subtitle').textContent=`Unit ${M.unit_id} · overall ${M.status}`;
$('#stats').innerHTML=`<div class="stat"><b>${M.total}</b>items</div>
<div class="stat"><b style="color:var(--done)">${done}</b>done</div>
<div class="stat"><b style="color:var(--pending)">${pend}</b>pending</div>
<div class="stat"><b>${new Set(ITEMS.map(i=>i.loc)).size}</b>locations</div>
<div class="stat"><b>${new Set(ITEMS.map(i=>i.cat)).size}</b>categories</div>`;
$('#progbar').style.width=(M.total?100*done/M.total:0).toFixed(1)+'%';
$('#loc').innerHTML='<option value="">All locations</option>';
[...new Set(ITEMS.map(i=>i.loc))].sort().forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;$('#loc').appendChild(o);});
$('#cat').innerHTML='<option value="">All categories</option>';
[...new Set(ITEMS.map(i=>i.cat))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('#cat').appendChild(o);});
$('#q').value='';fStatus='all';[...$('#statusSeg').children].forEach((x,i)=>x.classList.toggle('on',i===0));render();}
function render(){const ITEMS=window._I,M=window._M,q=$('#q').value.toLowerCase().trim(),loc=$('#loc').value,cat=$('#cat').value;
let rows=ITEMS.filter(i=>(fStatus==='all'||i.status===fStatus)&&(!loc||i.loc===loc)&&(!cat||i.cat===cat)&&
(!q||`${i.desc} ${i.loc} ${i.cat} ${i.correction} ${i.action}`.toLowerCase().includes(q)));
$('#count').textContent=`${rows.length} of ${M.total} items`;const list=$('#list');list.innerHTML='';
if(!rows.length){list.innerHTML='<div class="empty">No items match.</div>';return;}
let curLoc=null;rows.forEach(i=>{
if(i.loc!==curLoc){curLoc=i.loc;const h=document.createElement('div');h.className='loc-h';h.textContent=i.loc||'—';list.appendChild(h);}
const card=document.createElement('div');card.className='card';const bcls=i.status==='Completed'?'b-done':'b-pending';
let extra='';if(i.correction)extra+=`<div class="kv"><b>Correction:</b> ${esc(i.correction)}</div>`;
if(i.root)extra+=`<div class="kv"><b>Root cause:</b> ${esc(i.root)}</div>`;
if(i.action)extra+=`<div class="kv"><b>Action:</b> ${esc(i.action)}</div>`;
let imgs='';if(i.img)imgs+=`<figure><figcaption>Defect</figcaption><img loading="lazy" src="${i.img}" onerror="this.style.opacity=.3"></figure>`;
if(i.fix)imgs+=`<figure><figcaption>Contractor fix</figcaption><img loading="lazy" src="${i.fix}" onerror="this.style.opacity=.3"></figure>`;
card.innerHTML=`<div class="top"><div><span class="pill">#${i.order}</span> <span class="pill">${esc(i.cat)}</span></div>
<span class="badge ${bcls}">${esc(i.status)}</span></div>
<div class="desc">${esc(i.desc)||'<i style=color:var(--muted)>No description</i>'}</div>${extra}
<div class="meta">aging ${i.aging??'—'} · updated ${esc(i.updated)||'—'}</div>
<div class="imgs">${imgs}</div>`;list.appendChild(card);});}
$('#defsel').addEventListener('change',e=>{CUR=+e.target.value;loadDefect();window.scrollTo(0,0);});
$('#statusSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
[...$('#statusSeg').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');fStatus=b.dataset.s;render();});
$('#q').addEventListener('input',render);$('#loc').addEventListener('change',render);$('#cat').addEventListener('change',render);
$('#list').addEventListener('click',e=>{if(e.target.tagName==='IMG'){$('#modalImg').src=e.target.src;$('#modal').style.display='flex';}});
$('#modal').addEventListener('click',()=>{$('#modal').style.display='none';$('#modalImg').src='';});
loadDefect();
</script></body></html>
